<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAD-Agent demo</title>
  <style>
    body { margin: 0; color: #17212c; background: #f6f8fa; font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { margin: 0 0 .5rem; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    a { color: #0755a3; }
    button { margin: 0 0 .75rem; padding: .5rem .85rem; border: 0; border-radius: .3rem; background: #0755a3; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>VAD-Agent demo</h1>
    <p>UCF-Crime example showing the agent outputs, direct segment scores, and final refined scores.</p>
    <button id="play-narration" type="button" aria-controls="demo-video">Play with narration</button>
    <video id="demo-video" controls preload="metadata" playsinline aria-label="VAD-Agent demo">
      <source src="VAD-Agent.mp4?v=2" type="video/mp4">
      <a href="VAD-Agent.mp4">Download the demo video</a>
    </video>
    <p><a href="VAD-Agent.mp4" download>Download the MP4</a> · <a href="https://github.com/MoshiraAbdalla/VAD-Agent">VAD-Agent repository</a></p>
  </main>
  <script>
    const player = document.getElementById("demo-video");
    document.getElementById("play-narration").addEventListener("click", async () => {
      player.muted = false;
      player.volume = 1;
      try {
        await player.play();
      } catch {
        player.focus();
      }
    });
  </script>
</body>
</html>
